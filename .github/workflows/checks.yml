# Runs the fast checks and the browser smoke on every push and pull request (P4-02).
# Actions are pinned to commit SHAs; the comment gives the release they came from.
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fast:
    name: Structure and docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tests/check_structure.py
      - run: python3 tools/check_docs.py

  browser:
    name: Browser smoke (Chromium, Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm test
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          path: tests/e2e/test-results/
          retention-days: 7
